{% extends "blog/base.html" %}
{% load static %}
{% block content %}

<div class="dlt_upload_img--form" id="dltImg-div">
<h2>Delete Image</h2>
<p>Are you sure you want to delete this image?</p>
<div class="pic-div">
  <div class="image-item">
    <img src="{{ image.image.url }}" alt="{{ image.description }}" style="max-height:300px">
  </div>
  <div class="">
    <p class="dlt_image-description">{{ image.description }}</p>
  </div>
</div>
<div class="uploadPic-div">
<form method="post">
  {% csrf_token %}
  <button class="btn post_form-btn btn-outline-info btn-danger" type="submit">Delete This Image</button>
  <a class="cancelForm-btn btn-warning" href="{% url 'blog-gallery'  %}">Cancel</a>
</form>
</div>

</div>
{% endblock %}
