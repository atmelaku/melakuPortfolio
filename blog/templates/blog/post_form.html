{% extends "blog/base.html" %}

{% load crispy_forms_tags %}

{% block content %}

<div class="content-section">
  <form  method="POST">
    {% csrf_token %}
    <fieldset class="form-group">
      <legend class="border-bottom mb-4">Create New Blog Post</legend>
      {{ form | crispy }}
    </fieldset>
      <div class="form-group">
        <button class="btn post_form-btn btn-outline-info" type="submit" >Publish Post</button>
        <a class="cancelForm-btn btn-warning"  href="{% url 'blog-home'  %}" >Cancel</a>
      </div>
  </form>
</div>

{% endblock %}
